
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planeta Empanada — Pedidos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1208;--bg2:#231910;--bg3:#2e2015;--bg4:#3a2a1a;
  --text:#f5ede0;--text2:#a08060;--text3:#6a4f35;
  --border:rgba(210,160,80,.12);--border2:rgba(210,160,80,.25);
  --gold:#D4943A;--gold2:#f0b060;--gold-bg:rgba(212,148,58,.15);
  --green:#2aad7a;--green-bg:rgba(42,173,122,.15);
  --red:#d95f4b;--red-bg:rgba(217,95,75,.15);
  --blue:#5b9bd5;--blue-bg:rgba(91,155,213,.15);
  --warm:#c8824a;
  --radius:10px;--radius-lg:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),var(--warm));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-size:14px;font-weight:700}
.logo-sub{font-size:11px;color:var(--text2)}
.status-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);background:var(--bg3);padding:4px 10px;border-radius:20px;border:.5px solid var(--border)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.dot.ok{background:var(--green)}.dot.saving{background:var(--gold);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* LOGIN */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);padding:1.5rem}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:2.5rem;width:100%;max-width:380px;text-align:center}
.login-emoji{font-size:44px;margin-bottom:1rem;display:block}
.login-title{font-size:20px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:1.75rem;line-height:1.5}
.login-select{width:100%;padding:11px 14px;font-size:14px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);margin-bottom:10px;cursor:pointer}
.login-select:focus{outline:none;border-color:var(--gold)}
.login-btn{width:100%;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold),var(--warm));color:#1a0f00;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.4;cursor:not-allowed}

/* MAIN */
#screen-main{display:none;padding:1rem;max-width:800px;margin:0 auto}
.suc-header{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.875rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.suc-name{font-size:16px;font-weight:700}
.suc-chips{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.chip-ref{background:var(--blue-bg);color:var(--blue)}
.chip-con{background:rgba(160,100,200,.15);color:#c090f0}
.chip-fecha{background:var(--bg3);color:var(--text2);border:.5px solid var(--border)}
.btn-sec{padding:6px 12px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer}
.btn-sec:hover{background:var(--bg3)}

/* TABLA PEDIDO */
.ped-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1rem}
.ped-table{width:100%;border-collapse:collapse;font-size:13px}
.ped-table thead th{background:var(--bg3);padding:9px 12px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.ped-table thead th.col-prod{text-align:left}
.ped-table thead th.col-num{text-align:center;width:90px}
.ped-table thead th.col-ped{text-align:center;width:120px;color:var(--gold)}
.ped-table tbody tr{border-bottom:.5px solid var(--border);transition:background .1s}
.ped-table tbody tr:last-child{border-bottom:none}
.ped-table tbody tr:hover{background:var(--bg3)}
.ped-table tbody tr.area-sep td{background:var(--bg3);padding:5px 12px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;border-top:1px solid var(--border)}
.ped-table tbody tr.has-value td{background:var(--gold-bg)}
.ped-table tbody tr.has-value:hover td{background:rgba(212,148,58,.2)}
td.col-prod{padding:10px 12px;font-weight:600;color:var(--text)}
td.col-num{padding:6px 8px;text-align:center}
td.col-ped{padding:6px 8px;text-align:center}

/* INPUTS DE TABLA */
.tbl-input{width:72px;padding:6px 6px;font-size:14px;font-weight:700;text-align:center;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);-moz-appearance:textfield}
.tbl-input::-webkit-outer-spin-button,.tbl-input::-webkit-inner-spin-button{-webkit-appearance:none}
.tbl-input:focus{outline:none;border-color:var(--gold);background:var(--bg4)}
.tbl-input.ideal{color:var(--text2)}
.tbl-input.actual{color:var(--warm)}
.tbl-input.pedido{color:var(--gold2);border-color:rgba(212,148,58,.3);background:rgba(212,148,58,.07)}
.tbl-input.pedido:focus{border-color:var(--gold)}
.sug-chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-top:2px}
.sug-pos{background:var(--green-bg);color:var(--green)}
.sug-ok{background:var(--bg3);color:var(--text3)}
.qty-btns{display:flex;align-items:center;gap:3px;justify-content:center}
.qty-btn{width:26px;height:26px;border:1px solid var(--border2);border-radius:6px;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qty-btn:hover{background:var(--bg4);color:var(--text)}
.qty-btn:active{transform:scale(.9)}

/* BOTTOM */
.bottom-bar{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total-disp{display:flex;align-items:baseline;gap:5px}
.total-num{font-size:22px;font-weight:800;color:var(--gold)}
.total-lbl{font-size:12px;color:var(--text2)}
.btn-enviar{padding:10px 22px;font-size:14px;font-weight:700;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold),var(--warm));color:#1a0f00;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn-enviar:hover{opacity:.88}
.btn-enviar:disabled{opacity:.4;cursor:not-allowed}
.btn-limpiar{padding:8px 14px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer}
.btn-limpiar:hover{background:var(--bg3)}
.btn-guardar{padding:8px 14px;font-size:12px;font-weight:600;border:1px solid rgba(42,173,122,.3);border-radius:var(--radius);background:var(--green-bg);color:var(--green);cursor:pointer}
.btn-guardar:hover{background:rgba(42,173,122,.25)}

/* SUCCESS */
#screen-success{display:none;align-items:center;justify-content:center;min-height:calc(100vh - 56px);padding:1.5rem}
.success-card{background:var(--bg2);border:1px solid rgba(42,173,122,.3);border-radius:var(--radius-lg);padding:2.5rem;width:100%;max-width:440px;text-align:center}
.success-icon{font-size:48px;color:var(--green);display:block;margin-bottom:.75rem}
.success-title{font-size:20px;font-weight:700;margin-bottom:6px}
.success-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6}
.success-res{background:var(--bg3);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;text-align:left;max-height:240px;overflow-y:auto}
.btn-nuevo{padding:10px 22px;font-size:13px;font-weight:600;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text);cursor:pointer}
.btn-nuevo:hover{background:var(--bg3)}

.obs-wrap{margin-bottom:1rem}
.obs-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.obs-label::after{content:'';flex:1;height:1px;background:var(--border)}
.obs-input{width:100%;padding:9px 11px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);resize:none;min-height:55px}
.obs-input:focus{outline:none;border-color:var(--gold)}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,15,0,.3);border-top-color:#1a0f00;border-radius:50%;animation:spin .7s linear infinite}
.spinner-dark{border-color:rgba(245,237,224,.15);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:9px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:.75rem;display:flex;align-items:center;gap:7px}
.alert-ok{background:var(--green-bg);color:#6ee7b7;border:.5px solid rgba(42,173,122,.3)}
.alert-err{background:var(--red-bg);color:#fca5a5;border:.5px solid rgba(217,95,75,.3)}
.alert-info{background:var(--gold-bg);color:var(--gold2);border:.5px solid rgba(212,148,58,.3)}
.empty{text-align:center;padding:2.5rem;color:var(--text2);font-size:13px}
.empty i{font-size:28px;display:block;margin-bottom:8px;color:var(--text3)}
.loading{text-align:center;padding:3rem;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px}

@media(max-width:540px){
  .tbl-input{width:58px;font-size:13px}
  .ped-table thead th.col-num{width:70px}
  .ped-table thead th.col-ped{width:95px}
  .bottom-bar{flex-direction:column;align-items:stretch}
  .btn-enviar{justify-content:center}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🥟</div>
    <div><div class="logo-text">Planeta Empanada</div><div class="logo-sub">Pedidos</div></div>
  </div>
  <div class="status-chip"><span class="dot" id="sdot"></span><span id="stxt">Conectando...</span></div>
</header>

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-card">
    <span class="login-emoji">🥟</span>
    <div class="login-title">Cargar Pedido</div>
    <div class="login-sub">Seleccioná tu sucursal para comenzar</div>
    <select id="sel-sucursal" class="login-select"><option value="">Cargando...</option></select>
    <button class="login-btn" id="btn-ingresar" onclick="ingresar()" disabled>Ingresar →</button>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main">
  <div class="suc-header">
    <div>
      <div class="suc-name" id="suc-nombre">—</div>
      <div class="suc-chips">
        <span class="chip" id="suc-tipo-chip">—</span>
        <span class="chip chip-fecha"><i class="ti ti-calendar" style="font-size:10px"></i> <span id="hdr-fecha">—</span></span>
      </div>
    </div>
    <button class="btn-sec" onclick="cerrarSesion()"><i class="ti ti-logout"></i> Cambiar</button>
  </div>

  <div id="alert-wrap"></div>
  <div id="pedido-content"></div>

  <div class="obs-wrap">
    <div class="obs-label"><i class="ti ti-message" style="font-size:10px"></i> Observaciones</div>
    <textarea class="obs-input" id="obs-input" placeholder="Alguna aclaración para fábrica... (opcional)" rows="2"></textarea>
  </div>
  <div style="height:70px"></div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="total-disp">
      <span class="total-num" id="total-display">0</span>
      <span class="total-lbl" id="total-lbl">bandejas</span>
    </div>
    <button class="btn-guardar" onclick="guardarStockSilencioso()" title="Guardar stock ideal y actual"><i class="ti ti-device-floppy"></i> Guardar stock</button>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn-limpiar" onclick="limpiarPedido()" title="Limpiar pedido"><i class="ti ti-trash"></i></button>
    <button class="btn-enviar" id="btn-enviar" onclick="enviarPedido()" disabled>
      <i class="ti ti-send"></i> Enviar pedido
    </button>
  </div>
</div>

<!-- SUCCESS -->
<div id="screen-success">
  <div class="success-card">
    <i class="ti ti-circle-check success-icon"></i>
    <div class="success-title">¡Pedido enviado!</div>
    <div class="success-sub" id="success-sub"></div>
    <div class="success-res" id="success-res"></div>
    <button class="btn-nuevo" onclick="nuevoPedido()"><i class="ti ti-refresh"></i> Cargar nuevo pedido</button>
  </div>
</div>

<script>
const SB='https://ugmjfvgjumpnvbfskcgl.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnbWpmdmdqdW1wbnZiZnNrY2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjU4OTIsImV4cCI6MjA5NDEwMTg5Mn0.fmf7Isp5rDi10mq0VjahWRCgl6J4mD8-ib89DKWtPLs';
const H={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
const get=async(t,f='')=>{const r=await fetch(`${SB}/rest/v1/${t}?${f}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const ins=async(t,d)=>{const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()};
const upsert=async(t,d)=>{const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()};
const ss=(s,t)=>{document.getElementById('sdot').className='dot '+(s==='ok'?'ok':s==='saving'?'saving':'');document.getElementById('stxt').textContent=t};
const showAlert=(msg,tipo='info')=>{document.getElementById('alert-wrap').innerHTML=`<div class="alert alert-${tipo}"><i class="ti ti-${tipo==='ok'?'check':'info-circle'}"></i>${msg}</div>`;setTimeout(()=>document.getElementById('alert-wrap').innerHTML='',4000);};

const hoy=new Date().toISOString().slice(0,10);
const hoyLabel=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

let sucursales=[], sucActual=null, productos=[], stockIdeal={}, stockActual={}, pedidoValues={};

async function init(){
  ss('','Conectando...');
  try{
    sucursales=await get('sucursales','activa=eq.true&order=nombre.asc');
    const sel=document.getElementById('sel-sucursal');
    sel.innerHTML='<option value="">— Seleccioná tu sucursal —</option>';
    sucursales.forEach(s=>{
      const o=document.createElement('option');o.value=s.id;
      o.textContent=s.nombre+' ('+(s.tipo==='refrigerado'?'Refrig.':'Congelado')+')';
      sel.appendChild(o);
    });
    document.getElementById('btn-ingresar').disabled=false;
    ss('ok','Conectado');
  }catch(e){ss('','Sin conexión');}
}

async function ingresar(){
  const sid=document.getElementById('sel-sucursal').value;
  if(!sid)return;
  sucActual=sucursales.find(s=>s.id===sid);
  if(!sucActual)return;
  const btn=document.getElementById('btn-ingresar');
  btn.innerHTML='<span class="spinner"></span> Cargando...';btn.disabled=true;
  document.getElementById('pedido-content').innerHTML='<div class="loading"><span class="spinner spinner-dark"></span> Cargando productos...</div>';
  try{
    // Una sola llamada paralela para todo
    const[asignados,areas,idealData,pedidoExist]=await Promise.all([
      get('sucursal_productos',`sucursal_id=eq.${sucActual.id}&activo=eq.true`),
      get('areas','order=nombre.asc'),
      get('sucursal_stock_ideal',`sucursal_id=eq.${sucActual.id}`),
      get('pedidos_sucursal',`sucursal_id=eq.${sucActual.id}&fecha=eq.${hoy}&select=items,observaciones`)
    ]);

    // Cargar productos — si tiene asignados usar esos, sino todos de la empresa
    let prods;
    if(asignados.length){
      const ids=asignados.map(a=>a.producto_id).filter(Boolean);
      if(ids.length){
        prods=await get('productos',`id=in.(${ids.join(',')})&order=orden.asc,nombre.asc`);
      } else {
        prods=await get('productos',`empresa_id=eq.${sucActual.empresa_id}&order=orden.asc,nombre.asc`);
        const nombres=new Set(asignados.map(a=>a.producto));
        prods=prods.filter(p=>nombres.has(p.nombre));
      }
    } else {
      prods=await get('productos',`empresa_id=eq.${sucActual.empresa_id}&order=orden.asc,nombre.asc`);
    }

    // Enriquecer con área
    productos=prods.map(p=>{const a=areas.find(x=>x.id===p.area_id);return{...p,area_nombre:a?a.nombre:'General'};});

    // Stock ideal y actual guardado
    stockIdeal={};stockActual={};
    idealData.forEach(i=>{
      const k=i.producto_id||i.producto;
      stockIdeal[k]=i.cantidad||0;
      stockActual[k]=i.stock_actual||0;
    });

    // Pedido existente hoy — pre-cargar
    pedidoValues={};
    if(pedidoExist.length){
      (pedidoExist[0].items||[]).forEach(it=>{if(it.cantidad>0)pedidoValues[it.producto_id]=it.cantidad;});
      document.getElementById('obs-input').value=pedidoExist[0].observaciones||'';
    } else {
      // Pre-cargar sugerido como pedido inicial
      productos.forEach(p=>{
        const k=p.id;
        const ideal=stockIdeal[k]||stockIdeal[p.nombre]||0;
        const actual=stockActual[k]||stockActual[p.nombre]||0;
        const sug=Math.max(0,ideal-actual);
        if(sug>0)pedidoValues[k]=sug;
      });
    }

    mostrarMain();
  }catch(e){
    ss('error','Error');
    document.getElementById('pedido-content').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
  }
  btn.innerHTML='Ingresar →';btn.disabled=false;
}

function mostrarMain(){
  document.getElementById('screen-login').style.display='none';
  document.getElementById('screen-main').style.display='block';
  document.getElementById('bottom-bar').style.display='flex';
  document.getElementById('suc-nombre').textContent=sucActual.nombre;
  document.getElementById('hdr-fecha').textContent=hoyLabel;
  const chip=document.getElementById('suc-tipo-chip');
  if(sucActual.tipo==='refrigerado'){chip.textContent='❄️ Refrigerado';chip.className='chip chip-ref';}
  else{chip.textContent='🧊 Congelado';chip.className='chip chip-con';}
  const unidadLbl=sucActual.tipo==='refrigerado'?'bandejas':'cajas';
  document.getElementById('total-lbl').textContent=unidadLbl;
  renderTabla();
}

function getIdeal(p){return stockIdeal[p.id]||stockIdeal[p.nombre]||0;}
function getActual(p){return stockActual[p.id]||stockActual[p.nombre]||0;}
function getSugerido(p){return Math.max(0,(getIdeal(p)||0)-(getActual(p)||0));}

function renderTabla(){
  const el=document.getElementById('pedido-content');
  if(!productos.length){el.innerHTML='<div class="empty"><i class="ti ti-package-off"></i>Sin productos asignados.</div>';return;}
  const unidad=sucActual.tipo==='refrigerado'?'bandejas':'cajas';

  // Agrupar por área
  const areas={};
  productos.forEach(p=>{const a=p.area_nombre||'General';if(!areas[a])areas[a]=[];areas[a].push(p);});
  const multiArea=Object.keys(areas).length>1;

  let h=`<div class="ped-table-wrap"><table class="ped-table"><thead><tr>
    <th class="col-prod">Producto</th>
    <th class="col-num">Stock ideal</th>
    <th class="col-num">Stock actual</th>
    <th class="col-ped">Pedido (${unidad})</th>
  </tr></thead><tbody>`;

  Object.entries(areas).forEach(([area,prods])=>{
    if(multiArea){
      h+=`<tr class="area-sep"><td colspan="4">${area}</td></tr>`;
    }
    prods.forEach(p=>{
      const ideal=getIdeal(p);
      const actual=getActual(p);
      const sug=getSugerido(p);
      const pedVal=pedidoValues[p.id]||0;
      const hasVal=pedVal>0;
      h+=`<tr class="${hasVal?'has-value':''}" id="tr-${p.id}">
        <td class="col-prod">${p.nombre}</td>
        <td class="col-num">
          <input class="tbl-input ideal" type="number" min="0" step="0.5"
            id="ideal-${p.id}" value="${ideal||''}" placeholder="—"
            oninput="onIdeal('${p.id}',this.value)"/>
        </td>
        <td class="col-num">
          <input class="tbl-input actual" type="number" min="0" step="0.5"
            id="actual-${p.id}" value="${actual||''}" placeholder="—"
            oninput="onActual('${p.id}',this.value)"/>
        </td>
        <td class="col-ped">
          <div class="qty-btns">
            <button class="qty-btn" onclick="cambiarQty('${p.id}',-0.5)">−</button>
            <input class="tbl-input pedido" type="number" min="0" step="0.5"
              id="ped-${p.id}" value="${pedVal||''}" placeholder="0"
              oninput="onPedido('${p.id}',this.value)"/>
            <button class="qty-btn" onclick="cambiarQty('${p.id}',0.5)">+</button>
          </div>
        </td>
      </tr>`;
    });
  });

  h+=`</tbody></table></div>`;
  el.innerHTML=h;
  actualizarTotal();
}

function onIdeal(pid,val){
  const v=parseFloat(val)||0;
  stockIdeal[pid]=v;
  // Recalcular sugerido y actualizar pedido si no fue tocado manualmente
  const p=productos.find(x=>x.id===pid);
  if(!p)return;
  const actual=getActual(p);
  const sug=Math.max(0,v-actual);
  const pedInp=document.getElementById(`ped-${pid}`);
  if(pedInp&&!pedInp.dataset.manual){
    pedidoValues[pid]=sug;
    pedInp.value=sug||'';
    const tr=document.getElementById(`tr-${pid}`);
    if(tr)tr.className=sug>0?'has-value':'';
  }
  actualizarTotal();
}

function onActual(pid,val){
  const v=parseFloat(val)||0;
  stockActual[pid]=v;
  // Recalcular sugerido
  const p=productos.find(x=>x.id===pid);
  if(!p)return;
  const ideal=getIdeal(p);
  const sug=Math.max(0,ideal-v);
  const pedInp=document.getElementById(`ped-${pid}`);
  if(pedInp&&!pedInp.dataset.manual){
    pedidoValues[pid]=sug;
    pedInp.value=sug||'';
    const tr=document.getElementById(`tr-${pid}`);
    if(tr)tr.className=sug>0?'has-value':'';
  }
  actualizarTotal();
}

function onPedido(pid,val){
  const v=parseFloat(val)||0;
  pedidoValues[pid]=v;
  const pedInp=document.getElementById(`ped-${pid}`);
  if(pedInp)pedInp.dataset.manual='1'; // marcamos como editado manualmente
  const tr=document.getElementById(`tr-${pid}`);
  if(tr)tr.className=v>0?'has-value':'';
  actualizarTotal();
}

function cambiarQty(pid,step){
  const inp=document.getElementById(`ped-${pid}`);
  const cur=parseFloat(inp?.value)||0;
  const nuevo=Math.max(0,Math.round((cur+step)*10)/10);
  inp.value=nuevo||'';
  onPedido(pid,nuevo);
}

function actualizarTotal(){
  const tot=Object.values(pedidoValues).reduce((s,v)=>s+(v||0),0);
  document.getElementById('total-display').textContent=tot.toLocaleString('es-AR',{maximumFractionDigits:1});
  document.getElementById('btn-enviar').disabled=tot===0;
}

function limpiarPedido(){
  if(!confirm('¿Limpiar el pedido?'))return;
  pedidoValues={};
  productos.forEach(p=>{
    const inp=document.getElementById(`ped-${p.id}`);
    if(inp){inp.value='';delete inp.dataset.manual;}
    const tr=document.getElementById(`tr-${p.id}`);
    if(tr)tr.className='';
  });
  actualizarTotal();
}

async function guardarStockSilencioso(){
  if(!sucActual||!productos.length)return;
  ss('saving','Guardando stock...');
  try{
    const rows=productos.map(p=>({
      sucursal_id:sucActual.id,
      producto_id:p.id,
      producto:p.nombre,
      cantidad:getIdeal(p),
      stock_actual:getActual(p)
    }));
    // Batch upsert
    await fetch(`${SB}/rest/v1/sucursal_stock_ideal`,{
      method:'POST',
      headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(rows)
    });
    ss('ok','Stock guardado');
    showAlert('Stock ideal y actual guardado ✓','ok');
  }catch(e){ss('error','Error: '+e.message)}
}

async function enviarPedido(){
  const btn=document.getElementById('btn-enviar');
  btn.innerHTML='<span class="spinner"></span> Enviando...';btn.disabled=true;
  ss('saving','Enviando...');

  // Guardar stock en paralelo
  guardarStockSilencioso();

  const unidad=sucActual.tipo==='refrigerado'?'bandejas':'cajas';
  const items=productos
    .filter(p=>pedidoValues[p.id]>0)
    .map(p=>({
      producto_id:p.id,producto:p.nombre,
      cantidad:pedidoValues[p.id],unidad,
      stock_ideal:getIdeal(p),stock_actual:getActual(p)
    }));
  const obs=document.getElementById('obs-input').value.trim();

  try{
    const existing=await get('pedidos_sucursal',`sucursal_id=eq.${sucActual.id}&fecha=eq.${hoy}&select=id`);
    if(existing.length){
      await fetch(`${SB}/rest/v1/pedidos_sucursal?id=eq.${existing[0].id}`,{
        method:'PATCH',headers:{...H,'Prefer':'return=minimal'},
        body:JSON.stringify({items,observaciones:obs,estado:'pendiente',updated_at:new Date().toISOString()})
      });
    } else {
      await ins('pedidos_sucursal',{sucursal_id:sucActual.id,empresa_id:sucActual.empresa_id,fecha:hoy,items,observaciones:obs,estado:'pendiente'});
    }
    ss('ok','Enviado');
    mostrarSuccess(items);
  }catch(e){
    ss('error','Error');
    showAlert(e.message,'err');
    btn.innerHTML='<i class="ti ti-send"></i> Enviar pedido';btn.disabled=false;
  }
}

function mostrarSuccess(items){
  document.getElementById('screen-main').style.display='none';
  document.getElementById('bottom-bar').style.display='none';
  document.getElementById('screen-success').style.display='flex';
  const unidad=sucActual.tipo==='refrigerado'?'bandejas':'cajas';
  const total=items.reduce((s,it)=>s+it.cantidad,0);
  document.getElementById('success-sub').textContent=`${sucActual.nombre} — ${hoyLabel}`;
  let h='';
  items.forEach(it=>{
    h+=`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:.5px solid rgba(210,160,80,.1)">
      <span>${it.producto}</span>
      <span style="font-weight:700;color:var(--gold2)">${it.cantidad} <span style="font-weight:400;color:var(--text2)">${unidad}</span></span>
    </div>`;
  });
  h+=`<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:10px;color:var(--gold)">
    <span>TOTAL</span><span>${total.toLocaleString('es-AR')} ${unidad}</span>
  </div>`;
  document.getElementById('success-res').innerHTML=h;
}

function nuevoPedido(){
  pedidoValues={};
  document.getElementById('screen-success').style.display='none';
  document.getElementById('screen-main').style.display='block';
  document.getElementById('bottom-bar').style.display='flex';
  document.getElementById('obs-input').value='';
  renderTabla();
}

function cerrarSesion(){
  sucActual=null;pedidoValues={};stockIdeal={};stockActual={};productos=[];
  document.getElementById('screen-main').style.display='none';
  document.getElementById('bottom-bar').style.display='none';
  document.getElementById('screen-success').style.display='none';
  document.getElementById('screen-login').style.display='flex';
}

init();
</script>
</body>
</html>
